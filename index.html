<!DOCTYPE html>

<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pengecekan Inventaris Guru</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f6f8;
      color: #1f2937;
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
      padding: 16px;
      padding-bottom: 110px;
    }

    .header {
      background: #49945f;
      color: white;
      padding: 22px;
      border-radius: 18px;
      margin-bottom: 16px;
    }

    .header h1 {
      font-size: 23px;
      margin-bottom: 6px;
    }

    .header p {
      font-size: 14px;
      opacity: 0.9;
    }

    .top-links {
      display: flex;
      gap: 8px;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    .top-links a {
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.55);
      padding: 8px 10px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
    }

    .card {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .field {
      margin-bottom: 14px;
    }

    .field:last-child {
      margin-bottom: 0;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #6b7280;
      margin-bottom: 6px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      outline: none;
      font-size: 15px;
      background: white;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #2563eb;
    }

    input:disabled {
      background: #f3f4f6;
      color: #9ca3af;
    }

    .room-info {
      margin-top: 14px;
      padding: 14px;
      background: #eff6ff;
      border-radius: 12px;
      display: none;
    }

    .room-info strong {
      display: block;
      margin-bottom: 4px;
    }

    .help-text { color: #64748b; font-size: 12px; margin-top: 6px; line-height: 1.45; }
    .room-recommendations { margin-top: 9px; }
    .room-recommendations[hidden] { display: none; }
    .recommendation-label { color: #64748b; font-size: 12px; margin-bottom: 7px; }
    .recommendation-options { display: flex; flex-wrap: wrap; gap: 7px; }
    .recommendation-chip {
      border: 1px solid #bbd8c4;
      background: #f0f8f2;
      color: #27643a;
      padding: 7px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .recommendation-chip:hover,
    .recommendation-chip:focus-visible {
      border-color: #49945f;
      background: #e1f1e6;
      outline: none;
    }
    .recommendation-empty { color: #94a3b8; font-size: 12px; }
    .add-asset { margin-top: 14px; padding: 14px; background: #f8fafc; border: 1px dashed #94a3b8; border-radius: 12px; }
    .add-asset h3 { font-size: 15px; margin-bottom: 12px; }
    .add-asset-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 12px; }
    .add-asset-grid .field { margin: 0; }
    .add-asset-grid .full-width { grid-column: 1 / -1; }
    .add-asset-grid label span { color: #dc2626; }
    .secondary-btn { border: 0; background: #0f766e; color: #fff; padding: 10px 12px; border-radius: 10px; font-weight: 700; cursor: pointer; }
    .remove-asset-btn { border: 1px solid #fecaca; background: #fff1f2; color: #be123c; padding: 9px 11px; border-radius: 9px; font-weight: 700; cursor: pointer; }
    .remove-asset-btn:hover { background: #ffe4e6; }
    @media (max-width: 560px) {
      .add-asset-grid { grid-template-columns: 1fr; }
      .add-asset-grid .full-width { grid-column: auto; }
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 18px 0 10px;
    }

    .section-header h2 {
      font-size: 18px;
    }

    .asset-count {
      font-size: 13px;
      color: #6b7280;
    }

    .empty {
      background: white;
      border: 1px dashed #cbd5e1;
      color: #94a3b8;
      text-align: center;
      padding: 36px 16px;
      border-radius: 14px;
    }

    .asset-table-wrap {
      overflow-x: auto;
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
    }

    .asset-table {
      width: 100%;
      min-width: 820px;
      border-collapse: collapse;
    }

    .asset-table th,
    .asset-table td {
      padding: 12px;
      border-bottom: 1px solid #e5e7eb;
      text-align: left;
      vertical-align: middle;
    }

    .asset-table th {
      background: #f8fafc;
      color: #475569;
      font-size: 12px;
      text-transform: uppercase;
    }

    .asset-table tr:last-child td { border-bottom: 0; }
    .asset-table .number { width: 48px; text-align: center; color: #64748b; }
    .asset-table input,
    .asset-table select,
    .asset-table textarea { padding: 9px; font-size: 14px; }
    .asset-table textarea { min-width: 190px; resize: vertical; }
    @media (max-width: 640px) {
      .asset-table-wrap { margin: 0 -2px; }
    }

    .summary {
      display: none;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }

    .summary-card {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 14px;
    }

    .summary-card small {
      color: #6b7280;
    }

    .summary-card strong {
      display: block;
      font-size: 22px;
      margin-top: 5px;
    }

    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 12px 16px;
      background: white;
      border-top: 1px solid #e5e7eb;
    }

    .submit-btn {
      display: block;
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
      border: 0;
      background: #2563eb;
      color: white;
      padding: 15px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .submit-btn:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }

    @media (max-width: 560px) {
      .summary {
        grid-template-columns: 1fr;
      }
    }
  </style>

</head>

<div class="header">
  <h1>Pengecekan Inventaris</h1>
  <p>
    Pilih atau tulis ruangan, lalu masukkan inventaris yang digunakan jangka panjang.
  </p>

<div class="card">

  <div class="field">
    <label>PIC / Guru Penanggung Jawab</label>

    <input
      type="text"
      id="teacherName"
      placeholder="Contoh: Armand Maulana"
      list="picSuggestions"
    />
    <datalist id="picSuggestions"></datalist>
  </div>

  <div class="field">
    <label>Unit</label>
    <select id="unitSelect" onchange="handleUnitChange()">

  </div>

  <div class="field">
    <label>Nama Ruangan / Kelas</label>

    <div class="room-recommendations" id="roomRecommendations" hidden>

    </div>
    <p class="help-text">Ruangan yang belum ada boleh ditulis manual dan akan ditandai untuk verifikasi admin.</p>
  </div>

  <div class="room-info" id="roomInfo">
    <strong id="roomName"></strong>
    <span id="roomDescription"></span>
  </div>

</div>

<div class="summary" id="summary">

  <div class="summary-card">
    <small>Jenis Inventaris</small>
    <strong id="summaryAssets">0</strong>
  </div>

  <div class="summary-card">
    <small>Total Barang</small>
    <strong id="summaryExists">0</strong>
  </div>

  <div class="summary-card">
    <small>Perlu Perbaikan</small>
    <strong id="summaryMissing">0</strong>
  </div>

</div>

<div class="section-header">
  <h2>Daftar Inventaris</h2>

</div>

<div id="assetList">

    Pilih ruangan terlebih dahulu.
  </div>

</div>

        "APAR", "Bangku tunggu", "Papan informasi", "Tiang bendera", "Pompa air", "Genset"
      ]
    };
    const generalAssetRecommendations = [
      "Meja", "Kursi", "Lemari", "Rak", "Komputer atau laptop", "Printer",
      "Proyektor", "TV", "Speaker", "AC atau kipas angin", "CCTV", "Tempat sampah"
    ];
    const itemUnitRecommendations = ["Unit", "Buah", "Set", "Pasang", "Paket", "Lembar", "Batang", "Kotak"];
    const conditionRecommendations = ["Baik", "Rusak Ringan", "Rusak Berat", "Tidak Berfungsi"];


    /*
    |--------------------------------------------------------------------------
    | LOAD RUANGAN
    |--------------------------------------------------------------------------
    */

    async function loadRooms() {
      if (db) {
        const { data, error } = await db
          .from("rooms")
          .select("id, code, name, description, unit, pic_name")
          .order("name");

        if (error) {
          alert("Gagal mengambil data ruangan dari Supabase.");
          console.error(error);
        } else {
          rooms = data || [];
        }
      }

      updateSuggestions();

    }

    function updateSuggestions() {
      const pics = new Set(rooms.map(room => room.pic_name).filter(Boolean));
      document.getElementById("picSuggestions").innerHTML = [...pics].sort().map(name => `<option value="${name}"></option>`).join("");
      updateRoomRecommendations();
    }

    function getRoomRecommendations(unit, query = "") {
      const names = new Set([
        ...(roomRecommendations[unit] || []),
        ...rooms
          .filter(room => room.unit === unit)
          .map(room => room.name)
      ]);
      const normalizedQuery = query.trim().toLowerCase();

      return [...names]
        .filter(name => !normalizedQuery || name.toLowerCase().includes(normalizedQuery))
        .sort((first, second) => first.localeCompare(second, "id"));
    }

    function updateRoomRecommendations() {
      const unit = document.getElementById("unitSelect").value;
      const roomInput = document.getElementById("roomSelect");
      const container = document.getElementById("roomRecommendations");
      const label = document.getElementById("recommendationLabel");
      const options = document.getElementById("recommendationOptions");

      if (!unit) {
        container.hidden = true;
        options.innerHTML = "";
        return;
      }

      const allMatches = getRoomRecommendations(unit, roomInput.value);
      const visibleMatches = allMatches.slice(0, 6);
      container.hidden = false;
      label.textContent = roomInput.value.trim()
        ? `Rekomendasi ${unit} sesuai ketikan:`
        : `Rekomendasi untuk ${unit} (ketik untuk mencari lainnya):`;
      options.innerHTML = "";

      if (visibleMatches.length === 0) {
        const emptyText = document.createElement("span");
        emptyText.className = "recommendation-empty";
        emptyText.textContent = "Tidak ada rekomendasi yang cocok. Nama ini tetap dapat digunakan sebagai input manual.";
        options.appendChild(emptyText);
        return;
      }

      visibleMatches.forEach(name => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "recommendation-chip";
        button.textContent = name;
        button.addEventListener("click", () => {
          roomInput.value = name;
          updateRoomRecommendations();
          changeRoom();
        });
        options.appendChild(button);
      });
    }

    function handleUnitChange() {
      document.getElementById("roomSelect").value = "";
      updateRoomRecommendations();
      changeRoom();
    }


    /*
    |--------------------------------------------------------------------------
    | PILIH RUANGAN
    |--------------------------------------------------------------------------
    */

    function changeRoom() {
      updateSuggestions();
      const name = document.getElementById("roomSelect").value.trim();
      const unit = document.getElementById("unitSelect").value;

      if (!name || !unit) {

        selectedRoomId = null;

        document.getElementById("roomInfo").style.display =
          "none";

        document.getElementById("summary").style.display =
          "none";

        document.getElementById("assetList").innerHTML = `
          <div class="empty">
            Pilih unit dan isi nama ruangan terlebih dahulu.
          </div>
        `;

        document.getElementById("assetCount").textContent = "";

        document.getElementById("submitButton").disabled =
          true;

        return;

      }

      const room = rooms.find(item => item.name.toLowerCase() === name.toLowerCase() && (!item.unit || item.unit === unit));
      selectedRoomId = room ? room.id : `manual:${unit}:${name}`;

      document.getElementById("roomName").textContent =
        room ? `${room.name} (${room.code})` : `${name} (ruangan baru)`;

      document.getElementById("roomDescription").textContent =
        room ? (room.description || "") : "Input manual — akan diverifikasi admin.";

      document.getElementById("roomInfo").style.display =
        "block";

      document.getElementById("summary").style.display =
        "grid";

      document.getElementById("submitButton").disabled =
        false;
      document.getElementById("submitButton").textContent =
        "Simpan Pemeriksaan";

      const roomKey = String(selectedRoomId);
      if (!manuallyEnteredRooms.has(roomKey)) {
        inventoryByRoom[selectedRoomId] = [];
        manuallyEnteredRooms.add(roomKey);
      }
      renderAssets();

    }

    /*
    |--------------------------------------------------------------------------
    | RENDER INVENTARIS
    |--------------------------------------------------------------------------
    */

    function renderAssets() {

      const list = document.getElementById("assetList");

      const assets =
        inventoryByRoom[selectedRoomId] || [];

      document.getElementById(
        "assetCount"
      ).textContent = `${assets.length} jenis inventaris`;

      if (assets.length === 0) {

        list.innerHTML = manualAssetForm() + `
          <div class="empty">
            Belum ada inventaris. Tambahkan barang melalui kolom di atas.
          </div>
        `;

        updateSummary();
        document.getElementById("submitButton").disabled = true;

        return;

      }

      list.innerHTML = manualAssetForm() + `<div class="asset-table-wrap"><table class="asset-table">
        <thead><tr><th class="number">No</th><th>Nama Barang</th><th>Jumlah</th><th>Satuan/Unit</th><th>Kondisi</th><th>Keterangan</th><th>Aksi</th></tr></thead>
        <tbody>${assets.map((asset, index) => {

        return `<tr>
            <td class="number">${index + 1}</td>
            <td><input value="${escapeHtml(asset.name)}" list="assetSuggestions" onchange="setAssetName(${index}, this.value)" required></td>
            <td><input type="number" min="1" value="${asset.actualQty}" onchange="setActualQty(${index}, this.value)"></td>
            <td><input value="${escapeHtml(asset.itemUnit)}" list="itemUnitSuggestions" onchange="setItemUnit(${index}, this.value)" required></td>
            <td><input value="${escapeHtml(asset.condition)}" list="conditionSuggestions" onchange="setCondition(${index}, this.value)" required></td>
            <td><textarea rows="2" placeholder="Keterangan wajib diisi" onchange="setNote(${index}, this.value)" required>${escapeHtml(asset.note)}</textarea></td>
            <td><button type="button" class="remove-asset-btn" onclick="removeManualAsset(${index})">Hapus</button></td>
          </tr>`;

  }).join("")}</tbody></table></div>`;

  updateSummary();
  document.getElementById("submitButton").disabled = false;

}

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, character => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#039;"
  })[character]);
}

function getAssetRecommendationContext() {
  const roomName = document.getElementById("roomSelect").value.trim().toLowerCase();
  const categoryRules = [
    ["Ruang Kepala Sekolah", ["kepala sekolah"]],
    ["Ruang HRD/Kepegawaian", ["hrd", "kepegawaian"]],
    ["Laboratorium Komputer", ["laboratorium komputer", "lab komputer", "programming"]],
    ["Laboratorium IPA", ["laboratorium ipa", "lab ipa"]],
    ["Perpustakaan", ["perpustakaan"]],
    ["Ruang Olahraga", ["olahraga", "gym"]],
    ["Ruang Musik", ["ruang musik", "studio musik"]],
    ["Aula/Ruang Pertemuan", ["aula", "ruang pertemuan"]],
    ["UKS", ["uks"]],
    ["Kantin/Dapur", ["kantin", "dapur", "ruang makan"]],
    ["Ruang Ibadah", ["ibadah", "mushola", "masjid", "kapel"]],
    ["Pos Keamanan/Area Umum", ["keamanan", "satpam", "pos jaga", "area umum"]],
    ["Kantor/Tata Usaha", ["tata usaha", "kantor", "kurikulum", "administrasi"]],
    ["Ruang Guru", ["ruang guru"]],
    ["Ruang Kelas", ["kelas", "ruang pai", "matematika", "ruang bahasa", "inklusi", "digital art"]]
  ];
  const matchedCategory = categoryRules.find(([, keywords]) =>
    keywords.some(keyword => roomName.includes(keyword))
  )?.[0];

  return {
    category: matchedCategory || "Umum",
    items: matchedCategory
      ? assetRecommendationsByRoom[matchedCategory]
      : generalAssetRecommendations,
    note: matchedCategory === "Ruang Olahraga"
      ? "Bola, kok, tali skipping, dan barang yang cepat rusak sebaiknya dicatat sebagai perlengkapan olahraga."
      : ""
  };
}

function manualAssetForm() {
  const recommendation = getAssetRecommendationContext();
  return `<div class="add-asset">
    <h3>Tambah inventaris ruangan</h3>
    <p class="help-text" style="margin: -4px 0 12px;"><strong>Rekomendasi: ${escapeHtml(recommendation.category)}</strong>. Pilih dari saran atau tulis barang lain secara manual.</p>
    <div class="add-asset-grid">
      <div class="field">
        <label for="manualAssetName">Nama Barang <span>*</span></label>
        <input id="manualAssetName" list="assetSuggestions" placeholder="Pilih rekomendasi atau tulis manual" required />
      </div>
      <div class="field">
        <label for="manualAssetQty">Jumlah <span>*</span></label>
        <input id="manualAssetQty" type="number" min="1" value="1" required />
      </div>
      <div class="field">
        <label for="manualAssetUnit">Satuan/Unit <span>*</span></label>
        <input id="manualAssetUnit" list="itemUnitSuggestions" placeholder="Contoh: Unit, Buah, Set" required />
      </div>
      <div class="field">
        <label for="manualAssetCondition">Kondisi <span>*</span></label>
        <input id="manualAssetCondition" list="conditionSuggestions" value="Baik" required />
      </div>
      <div class="field full-width">
        <label for="manualAssetNote">Keterangan <span>*</span></label>
        <textarea id="manualAssetNote" rows="2" placeholder="Contoh: Digunakan di ruang kelas, kondisi normal" required></textarea>
      </div>
      <button type="button" class="secondary-btn full-width" onclick="addManualAsset()">Tambah ke Daftar Inventaris</button>
    </div>
    <datalist id="assetSuggestions">${recommendation.items.map(name => `<option value="${escapeHtml(name)}"></option>`).join("")}</datalist>
    <datalist id="itemUnitSuggestions">${itemUnitRecommendations.map(name => `<option value="${name}"></option>`).join("")}</datalist>
    <datalist id="conditionSuggestions">${conditionRecommendations.map(name => `<option value="${name}"></option>`).join("")}</datalist>
    <p class="help-text">Kolom bertanda * wajib diisi. ${escapeHtml(recommendation.note)}</p>
  </div>`;
}

function addManualAsset() {
  const name = document.getElementById("manualAssetName").value.trim();
  const qty = Number(document.getElementById("manualAssetQty").value);
  const itemUnit = document.getElementById("manualAssetUnit").value.trim();
  const condition = document.getElementById("manualAssetCondition").value.trim();
  const note = document.getElementById("manualAssetNote").value.trim();
  if (!name || !Number.isInteger(qty) || qty < 1 || !itemUnit || !condition || !note) {
    alert("Nama barang, jumlah, satuan/unit, kondisi, dan keterangan wajib diisi.");
    return;
  }
  const assets = inventoryByRoom[selectedRoomId] || (inventoryByRoom[selectedRoomId] = []);
  if (assets.some(asset => asset.name.toLowerCase() === name.toLowerCase())) {
    alert("Inventaris tersebut sudah ada di daftar.");
    return;
  }
  assets.push({
    id: null,
    code: `INV-${Date.now()}`,
    name,
    registeredQty: qty,
    actualQty: qty,
    itemUnit,
    exists: true,
    condition,
    note
  });
  renderAssets();
}


function removeManualAsset(index) {
  inventoryByRoom[selectedRoomId].splice(index, 1);
  renderAssets();
}


/*
|--------------------------------------------------------------------------
| UPDATE JUMLAH
|--------------------------------------------------------------------------
*/

function setActualQty(index, value) {

  const asset =
    inventoryByRoom[selectedRoomId][index];

  let qty = Number(value);

  if (qty < 1 || Number.isNaN(qty)) {
    qty = 1;
  }

  asset.actualQty = qty;
  asset.registeredQty = qty;
  asset.exists = true;

  renderAssets();

}


/*
|--------------------------------------------------------------------------
| UPDATE CATATAN
|--------------------------------------------------------------------------
*/

function setNote(index, value) {

  inventoryByRoom[selectedRoomId][index].note =
    value;

}

function setCondition(index, value) {
  inventoryByRoom[selectedRoomId][index].condition = value;
  updateSummary();
}

function setAssetName(index, value) {
  inventoryByRoom[selectedRoomId][index].name = value.trim();
}

function setItemUnit(index, value) {
  inventoryByRoom[selectedRoomId][index].itemUnit = value.trim();
}


/*
|--------------------------------------------------------------------------
| SUMMARY
|--------------------------------------------------------------------------
*/

function updateSummary() {

  const assets =
    inventoryByRoom[selectedRoomId] || [];

  const totalItems = assets.reduce(
    (total, asset) => total + Number(asset.actualQty || 0),
    0
  );

  const needsRepair =
    assets.filter(asset => asset.condition !== "Baik").length;

  document.getElementById(
    "summaryAssets"
  ).textContent = assets.length;

  document.getElementById(
    "summaryExists"
  ).textContent = totalItems;

  document.getElementById(
    "summaryMissing"
  ).textContent = needsRepair;

}


/*
|--------------------------------------------------------------------------
| SIMPAN
|--------------------------------------------------------------------------
*/

async function submitInventory() {

  const teacherName =
    document.getElementById(
      "teacherName"
    ).value.trim();

  if (!teacherName) {

    alert(
      "Nama guru / petugas belum diisi."
    );

    return;

  }

  if (!selectedRoomId) {

    alert(
      "Pilih ruangan terlebih dahulu."
    );

    return;

  }

  if ((inventoryByRoom[selectedRoomId] || []).length === 0) {
    alert("Tambahkan minimal satu inventaris sebelum menyimpan pemeriksaan.");
    return;
  }

  const incompleteItem = (inventoryByRoom[selectedRoomId] || []).find(asset =>
    !asset.name?.trim() ||
    !Number.isInteger(Number(asset.actualQty)) ||
    Number(asset.actualQty) < 1 ||
    !asset.itemUnit?.trim() ||
    !asset.condition?.trim() ||
    !asset.note?.trim()
  );

  if (incompleteItem) {
    alert("Lengkapi nama barang, jumlah, satuan/unit, kondisi, dan keterangan pada setiap inventaris.");
    return;
  }

  const normalizedNames = (inventoryByRoom[selectedRoomId] || []).map(asset => asset.name.trim().toLowerCase());
  if (new Set(normalizedNames).size !== normalizedNames.length) {
    alert("Nama inventaris tidak boleh duplikat dalam satu pemeriksaan.");
    return;
  }

  const submitButton = document.getElementById("submitButton");
  submitButton.disabled = true;
  submitButton.textContent = "Menyimpan...";

  let room = rooms.find(item => item.id === selectedRoomId);
  const unit = document.getElementById("unitSelect").value;
  const roomName = document.getElementById("roomSelect").value.trim();

  if (!room && db) {
    const roomCode = `MAN-${Date.now().toString().slice(-8)}`;
    const { data: newRoom, error: roomError } = await db
      .from("rooms")
      .insert({ code: roomCode, name: roomName, unit, pic_name: teacherName, status: "pending_verification", description: "Dibuat dari form guru; perlu verifikasi admin." })
      .select("id, code, name, description, unit, pic_name")
      .single();
    if (roomError) {
      alert("Gagal menyimpan ruangan baru ke Supabase. Pastikan skema database terbaru sudah dijalankan.");
      console.error(roomError);
      submitButton.disabled = false;
      submitButton.textContent = "Simpan Pemeriksaan";
      return;
    }
    room = newRoom;
    rooms.push(room);
    const manualAssets = inventoryByRoom[selectedRoomId] || [];
    selectedRoomId = room.id;
    inventoryByRoom[room.id] = manualAssets;
  }

  if (!room) {
    room = { id: selectedRoomId, code: "MANUAL", name: roomName };
  }

  const assets =
    inventoryByRoom[selectedRoomId] || [];

  const result = {

    teacher_name: teacherName,

    room_id: room.id,

    room_code: room.code,

    room_name: room.name,

    unit,

    checked_at:
      new Date().toISOString(),

    assets: assets.map(asset => ({

      asset_id: asset.id,

      asset_code: asset.code,

      asset_name: asset.name,

      item_unit: asset.itemUnit,

      registered_qty:
        asset.registeredQty,

      actual_qty:
        asset.actualQty,

      exists:
        asset.exists,

      difference:
        asset.actualQty -
        asset.registeredQty,

      note:
        asset.note,

      condition:
        asset.condition

    }))

  };

  console.log("DATA PEMERIKSAAN:");
  console.log(result);

  if (db) {
    const { data: inspection, error: inspectionError } = await db
      .from("inventory_checks")
      .insert({
        teacher_name: result.teacher_name,
        room_id: result.room_id,
        room_code: result.room_code,
        room_name: result.room_name,
        unit: result.unit,
        checked_at: result.checked_at
      })
      .select("id")
      .single();

    if (inspectionError) {
      alert("Gagal menyimpan pemeriksaan ke Supabase.");
      console.error(inspectionError);
      submitButton.disabled = false;
      submitButton.textContent = "Simpan Pemeriksaan";
      return;
    }

    const rows = result.assets.map(asset => ({
      inventory_check_id: inspection.id,
      asset_id: asset.asset_id,
      asset_code: asset.asset_code,
      asset_name: asset.asset_name,
      item_unit: asset.item_unit,
      registered_qty: asset.registered_qty,
      actual_qty: asset.actual_qty,
      exists: asset.exists,
      difference: asset.difference,
      note: asset.note
      ,condition: asset.condition
    }));

    const { error: detailError } = await db
      .from("inventory_check_items")
      .insert(rows);

    if (detailError) {
      alert("Data utama tersimpan, tetapi detail inventaris gagal disimpan.");
      console.error(detailError);
      submitButton.textContent = "Detail Gagal Tersimpan";
      return;
    }

    alert("Pemeriksaan berhasil disimpan ke Supabase.");
    submitButton.textContent = "Pemeriksaan Tersimpan";
    return;
  }

  alert(
    "Pemeriksaan berhasil disimpan!\n\n" +
    "Mode Supabase belum aktif. Isi SUPABASE_URL dan SUPABASE_ANON_KEY."
  );
  submitButton.textContent = "Pemeriksaan Tersimpan";

}


/*
|--------------------------------------------------------------------------
| INIT
|--------------------------------------------------------------------------
*/

loadRooms();

  </script>
