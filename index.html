      background: white;

    .asset-table .asset-meta { margin-top: 3px; }
    .asset-table input,

    .asset-table .exist-buttons { display: flex; margin: 0; min-width: 150px; }

    @media (max-width: 640px) {

      color: #4b5563;
      padding: 6px 9px;
      border-radius: 20px;
      font-size: 12px;
      white-space: nowrap;

    .exist-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 14px;
    }

    .exist-btn {
      border: 1px solid #d1d5db;
      background: white;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .exist-btn.ada.active {
      background: #dcfce7;
      color: #166534;
      border-color: #86efac;
    }

    .exist-btn.tidak.active {
      background: #fee2e2;
      color: #991b1b;
      border-color: #fca5a5;
    }

    .qty-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }

    .difference {
      padding: 12px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      display: flex;
      align-items: center;
    }

    .difference.same {
      background: #f0fdf4;
      color: #166534;
    }

    .difference.less {
      background: #fff7ed;
      color: #9a3412;
    }

    .difference.more {
      background: #eff6ff;
      color: #1d4ed8;
    }

    .summary {

      gap: 10px;
      margin-bottom: 16px;
    }

      border: 1px solid #e5e7eb;

      left: 0;
      right: 0;

    let selectedRoomId = null;


    /*
    |--------------------------------------------------------------------------
    | LOAD RUANGAN
    |--------------------------------------------------------------------------
    */

    async function loadRooms() {

      const select = document.getElementById("roomSelect");
      select.innerHTML = `<option value="">-- Pilih ruangan --</option>`;

      if (db) {
        const { data, error } = await db
          .from("rooms")
          .select("id, code, name, description")
          .order("name");

        if (error) {
          alert("Gagal mengambil data ruangan dari Supabase.");
          console.error(error);
        } else {
          rooms = data || [];
        }
      }

      rooms.forEach(room => {

        const option = document.createElement("option");

        option.value = room.id;

        option.textContent =
          `${room.name} - ${room.code}`;

        select.appendChild(option);

      });

    }


    /*
    |--------------------------------------------------------------------------
    | PILIH RUANGAN
    |--------------------------------------------------------------------------
    */

    function changeRoom() {

      const value =
        document.getElementById("roomSelect").value;

      if (!value) {

        selectedRoomId = null;

        document.getElementById("roomInfo").style.display =
          "none";

        document.getElementById("summary").style.display =
          "none";

        document.getElementById("assetList").innerHTML = `
          <div class="empty">
            Pilih ruangan terlebih dahulu.
          </div>
        `;

        document.getElementById("assetCount").textContent = "";

        document.getElementById("submitButton").disabled =
          true;

        return;

      }

      selectedRoomId = Number(value);

      const room = rooms.find(
        item => item.id === selectedRoomId
      );

      document.getElementById("roomName").textContent =
        `${room.name} (${room.code})`;

      document.getElementById("roomDescription").textContent =
        room.description;

      document.getElementById("roomInfo").style.display =
        "block";

      document.getElementById("summary").style.display =
        "grid";

      document.getElementById("submitButton").disabled =
        false;

      loadAssets(selectedRoomId);

    }

    async function loadAssets(roomId) {
      if (db) {
        const { data, error } = await db
          .from("assets")
          .select("id, code, name, registered_qty, condition")
          .eq("room_id", roomId)
          .order("name");

        if (error) {
          alert("Gagal mengambil data aset dari Supabase.");
          console.error(error);
          inventoryByRoom[roomId] = [];
        } else {
          inventoryByRoom[roomId] = (data || []).map(asset => ({
            id: asset.id,
            code: asset.code,
            name: asset.name,
            registeredQty: Number(asset.registered_qty || 0),
            actualQty: Number(asset.registered_qty || 0),
            exists: Number(asset.registered_qty || 0) > 0,
            condition: asset.condition || "Baik",
            note: ""
          }));
        }
      }

      renderAssets();
    }


    /*
    |--------------------------------------------------------------------------
    | RENDER ASET
    |--------------------------------------------------------------------------
    */

    function renderAssets() {

      const list = document.getElementById("assetList");

      const assets =
        inventoryByRoom[selectedRoomId] || [];

      document.getElementById(
        "assetCount"
      ).textContent = `${assets.length} jenis aset`;

      if (assets.length === 0) {

        list.innerHTML = `
          <div class="empty">
            Belum ada data aset untuk ruangan ini.
          </div>
        `;

        updateSummary();

        return;

      }

      list.innerHTML = `<div class="asset-table-wrap"><table class="asset-table">
        <thead><tr><th class="number">No</th><th>Nama Barang</th><th>Ada / Tidak</th><th>Jumlah</th><th>Kondisi</th><th>Catatan</th></tr></thead>
        <tbody>${assets.map((asset, index) => {

        const difference =
          asset.actualQty - asset.registeredQty;

        let differenceClass = "same";
        let differenceText = "Jumlah sesuai";

        if (!asset.exists) {

          differenceClass = "less";
          differenceText =
            `Tidak ditemukan - Selisih -${asset.registeredQty}`;

        } else if (difference < 0) {

          differenceClass = "less";
          differenceText =
            `Kurang ${Math.abs(difference)} unit`;

        } else if (difference > 0) {

          differenceClass = "more";
          differenceText =
            `Lebih ${difference} unit`;

        }

        return `<tr>
            <td class="number">${index + 1}</td>
            <td><div class="asset-name">${asset.name}</div><div class="asset-meta">${asset.code} - Tercatat: ${asset.registeredQty}</div></td>
            <td><div class="exist-buttons">

              <button
                type="button"
                class="exist-btn ada ${
                  asset.exists ? "active" : ""
                }"
                onclick="setExists(${index}, true)"
              >
                Ada
              </button>

              <button
                type="button"
                class="exist-btn tidak ${
                  !asset.exists ? "active" : ""
                }"
                onclick="setExists(${index}, false)"
              >
                Tidak Ada
              </button>

            </div></td>
            <td><input type="number" min="0" value="${asset.actualQty}" ${!asset.exists ? "disabled" : ""} onchange="setActualQty(${index}, this.value)"></td>
            <td><select onchange="setCondition(${index}, this.value)">
              ${["Baik", "Rusak Ringan", "Rusak Berat"].map(value => `<option value="${value}" ${asset.condition === value ? "selected" : ""}>${value}</option>`).join("")}
            </select></td>
            <td><textarea rows="2" placeholder="Catatan" onchange="setNote(${index}, this.value)">${asset.note}</textarea></td>
          </tr>`;

  }).join("")}</tbody></table></div>`;

  updateSummary();

}


/*
|--------------------------------------------------------------------------
| ADA / TIDAK ADA
|--------------------------------------------------------------------------
*/

function setExists(index, value) {

  const asset =
    inventoryByRoom[selectedRoomId][index];

  asset.exists = value;

  if (!value) {

    asset.actualQty = 0;

  } else if (asset.actualQty === 0) {

    asset.actualQty =
      asset.registeredQty > 0
        ? asset.registeredQty
        : 1;

  }

  renderAssets();

}


/*
|--------------------------------------------------------------------------
| UPDATE JUMLAH
|--------------------------------------------------------------------------
*/

function setActualQty(index, value) {

  const asset =
    inventoryByRoom[selectedRoomId][index];

  let qty = Number(value);

  if (qty < 0 || Number.isNaN(qty)) {
    qty = 0;
  }

  asset.actualQty = qty;

  asset.exists = qty > 0;

  renderAssets();

}


/*
|--------------------------------------------------------------------------
| UPDATE CATATAN
|--------------------------------------------------------------------------
*/

function setNote(index, value) {

  inventoryByRoom[selectedRoomId][index].note =
    value;

}

function setCondition(index, value) {
  inventoryByRoom[selectedRoomId][index].condition = value;
}


/*
|--------------------------------------------------------------------------
| SUMMARY
|--------------------------------------------------------------------------
*/

function updateSummary() {

  const assets =
    inventoryByRoom[selectedRoomId] || [];

  const exists =
    assets.filter(asset => asset.exists).length;

  const missing =
    assets.filter(asset => !asset.exists).length;

  document.getElementById(
    "summaryAssets"
  ).textContent = assets.length;

  document.getElementById(
    "summaryExists"
  ).textContent = exists;

  document.getElementById(
    "summaryMissing"
  ).textContent = missing;

}


/*
|--------------------------------------------------------------------------
| SIMPAN
|--------------------------------------------------------------------------
*/

async function submitInventory() {

  const teacherName =
    document.getElementById(
      "teacherName"
    ).value.trim();

  if (!teacherName) {

    alert(
      "Nama guru / petugas belum diisi."
    );

    return;

  }

  if (!selectedRoomId) {

    alert(
      "Pilih ruangan terlebih dahulu."
    );

    return;

  }

  const room =
    rooms.find(
      item => item.id === selectedRoomId
    );

  const assets =
    inventoryByRoom[selectedRoomId] || [];

  const result = {

    teacher_name: teacherName,

    room_id: room.id,

    room_code: room.code,

    room_name: room.name,

    checked_at:
      new Date().toISOString(),

    assets: assets.map(asset => ({

      asset_id: asset.id,

      asset_code: asset.code,

      asset_name: asset.name,

      registered_qty:
        asset.registeredQty,

      actual_qty:
        asset.actualQty,

      exists:
        asset.exists,

      difference:
        asset.actualQty -
        asset.registeredQty,

      note:
        asset.note,

      condition:
        asset.condition

    }))

  };

  console.log("DATA PEMERIKSAAN:");
  console.log(result);

  if (db) {
    const { data: inspection, error: inspectionError } = await db
      .from("inventory_checks")
      .insert({
        teacher_name: result.teacher_name,
        room_id: result.room_id,
        room_code: result.room_code,
        room_name: result.room_name,
        checked_at: result.checked_at
      })
      .select("id")
      .single();

    if (inspectionError) {
      alert("Gagal menyimpan pemeriksaan ke Supabase.");
      console.error(inspectionError);
      return;
    }

    const rows = result.assets.map(asset => ({
      inventory_check_id: inspection.id,
      asset_id: asset.asset_id,
      asset_code: asset.asset_code,
      asset_name: asset.asset_name,
      registered_qty: asset.registered_qty,
      actual_qty: asset.actual_qty,
      exists: asset.exists,
      difference: asset.difference,
      note: asset.note
      ,condition: asset.condition
    }));

    const { error: detailError } = await db
      .from("inventory_check_items")
      .insert(rows);

    if (detailError) {
      alert("Data utama tersimpan, tetapi detail aset gagal disimpan.");
      console.error(detailError);
      return;
    }

    alert("Pemeriksaan berhasil disimpan ke Supabase.");
    return;
  }

  alert(
    "Pemeriksaan berhasil disimpan!\n\n" +
    "Mode Supabase belum aktif. Isi SUPABASE_URL dan SUPABASE_ANON_KEY."
  );

}


/*
|--------------------------------------------------------------------------
| INIT
|--------------------------------------------------------------------------
*/

loadRooms();

  </script>
